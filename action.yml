name: Release to GitHub & Jira
description: A GitHub action to automatically create releases on Github and Jira. Links Jira tickets to release from commits.
author: brettjohnsen-sy
branding:
  icon: 'send'
  color: 'blue'
inputs:
  jira_server:
    description: Jira server
    required: true
  jira_project:
    description: Jira project
    required: true
  jira_user:
    description: Jira user
    required: true
  jira_token:
    description: Jira user token
    required: true
  release_name_format:
    description: Format string for the release name. Use {version} as placeholder for the git tag name. The format string must contain {version}. Examples 'Release {version}' or '{version}-prod'
    required: false
    default: '{version}'
  tag_format:
    description: "Regex pattern to extract version from tag. Use a capture group () to specify the version part. If not provided, uses the tag name as-is. Examples: 'release/prod/(.+)-RC\\.\\d+' or 'v(.+)'"
    required: false
    default: ''
  tag_name:
    description: "Git tag to create the release for. Defaults to the tag that triggered the workflow (github.ref_name). Set this when running via workflow_dispatch to (re)run the release for an existing tag."
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Get or create Github release
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
      run: |
        REPO="${{ github.repository }}"
        if gh api --method GET "/repos/$REPO/releases/tags/$TAG_NAME" --jq .body > notes.md 2>/dev/null; then
          echo "Release already exists for $TAG_NAME"
        else
          # Diff against the latest published release so notes cover only this
          # release's changes. Without previous_tag_name GitHub's auto-detection
          # can miss non-semver tags (e.g. release/prod/X-RC.N) and dump the
          # entire repo history, blowing past the 125k release-body limit (422).
          PREV=$(gh api "/repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "Creating release $TAG_NAME (previous tag: ${PREV:-none})"
          NOTES_ARGS=(-f tag_name="$TAG_NAME")
          [ -n "$PREV" ] && NOTES_ARGS+=(-f previous_tag_name="$PREV")
          gh api --method POST "/repos/$REPO/releases/generate-notes" \
            "${NOTES_ARGS[@]}" --jq .body > notes_full.md
          # Safety net: truncate to stay under GitHub's 125k body limit even if
          # the diff is still large (avoid `| head` so pipefail can't trip on SIGPIPE).
          head -c 120000 notes_full.md > notes.md
          gh release create "$TAG_NAME" --repo "$REPO" --title "$TAG_NAME" --notes-file notes.md
        fi
    - name: Update Jira
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_JIRA_SERVER: ${{ inputs.jira_server }}
        INPUT_JIRA_PROJECT: ${{ inputs.jira_project }}
        INPUT_JIRA_USER: ${{ inputs.jira_user }}
        INPUT_JIRA_TOKEN: ${{ inputs.jira_token }}
        INPUT_RELEASE_NAME_FORMAT: ${{ inputs.release_name_format }}
        INPUT_TAG_FORMAT: ${{ inputs.tag_format }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        # Not GITHUB_REF_NAME: that name is reserved and the runner ignores the
        # override, leaking the run's ref (a branch on workflow_dispatch) instead
        # of the resolved tag.
        RELEASE_TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
      run: python ./src/main.py
