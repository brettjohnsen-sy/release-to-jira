name: Release to GitHub & Jira
description: A GitHub action to automatically create releases on Github and Jira. Links Jira tickets to release from commits.
author: brettjohnsen-sy
branding:
  icon: 'send'
  color: 'blue'
inputs:
  jira_server:
    description: Jira server
    required: true
  jira_project:
    description: Jira project
    required: true
  jira_user:
    description: Jira user
    required: true
  jira_token:
    description: Jira user token
    required: true
  release_name_format:
    description: Format string for the release name. Use {version} as placeholder for the git tag name. The format string must contain {version}. Examples 'Release {version}' or '{version}-prod'
    required: false
    default: '{version}'
  tag_format:
    description: "Regex pattern to extract version from tag. Use a capture group () to specify the version part. If not provided, uses the tag name as-is. Examples: 'release/prod/(.+)-RC\\.\\d+' or 'v(.+)'"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Get or create Github release
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api \
          --method GET /repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} \
          --jq .body > notes.md \
        || \
        gh api \
          --method POST /repos/${{ github.repository }}/releases \
            -f tag_name='${{ github.ref_name }}' \
            -f name='${{ github.ref_name }}' \
            -F generate_release_notes=true \
          --jq .body > notes.md
    - name: Update Jira
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_JIRA_SERVER: ${{ inputs.jira_server }}
        INPUT_JIRA_PROJECT: ${{ inputs.jira_project }}
        INPUT_JIRA_USER: ${{ inputs.jira_user }}
        INPUT_JIRA_TOKEN: ${{ inputs.jira_token }}
        INPUT_RELEASE_NAME_FORMAT: ${{ inputs.release_name_format }}
        INPUT_TAG_FORMAT: ${{ inputs.tag_format }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python ./src/main.py
